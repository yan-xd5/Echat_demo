# eChat 观测基础设施 — 一键启动
# 用法: docker compose -f infra/docker-compose.observability.yaml up -d
# 面板: Grafana http://localhost:3000 (admin/admin)

services:
  # ─────────────────── OTel Collector ───────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.88.0
    container_name: echat-otel
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP（服务统一发到这里）
      - "8889:8889"   # Prometheus scrape endpoint
    restart: unless-stopped

  # ─────────────────── Jaeger (链路追踪) ───────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: echat-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
    restart: unless-stopped

  # ─────────────────── Prometheus (指标存储) ───────────────────
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: echat-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ─────────────────── Grafana (统一可视化) ───────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: echat-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ─────────────────── Pyroscope (持续 Profiling) ───────────────────
  pyroscope:
    image: grafana/pyroscope:1.2.0
    container_name: echat-pyroscope
    ports:
      - "4040:4040"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
