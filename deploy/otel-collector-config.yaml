# OpenTelemetry Collector 配置
# 接收 OTLP (gRPC 4317, HTTP 4318) → 导出到 Prometheus、Jaeger
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 512

exporters:
  # Prometheus 指标导出
  prometheus:
    endpoint: 0.0.0.0:8889
  # Jaeger 链路追踪导出
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # 调试日志（开发用，生产去掉）
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
