server:
  filter:
    - opentelemetry
  service:
    - name: trpc.echat.gateway.GatewayInternal
      ip: 0.0.0.0
      port: 8003
      protocol: trpc
      registry: polarismesh            # ★ 注册到北极星

client:
  filter:
    - opentelemetry
  service:
    - name: trpc.echat.controller.ControllerService
      discovery: polarismesh           # ★ 通过北极星发现 Controller
      protocol: trpc

plugins:
  registry:
    polarismesh:
      protocol: grpc
      address_list: 127.0.0.1:8091

  selector:
    polarismesh:
      address_list: 127.0.0.1:8091

  telemetry:
    opentelemetry:
      addr: http://127.0.0.1:4318
      tenant_id: echat
      sampler:
        fraction: 1.0
