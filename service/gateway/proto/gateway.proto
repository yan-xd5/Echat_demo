syntax = "proto3";

package echat.gateway;

option go_package = "echat/service/gateway/stub";

// ============================================================
// 代理服务对内接口（被 Controller 调用）
// ============================================================
service GatewayInternal {
    // Controller 推送消息给指定用户
    rpc PushToUser(PushToUserRequest) returns (PushToUserResponse);
}

message PushToUserRequest {
    string user_id = 1;    // 目标用户
    string msg_id  = 2;    // 消息 ID
    string content = 3;    // 消息内容
    string from_user_id = 4; // 发送者
}

message PushToUserResponse {
    bool delivered = 1;    // 是否成功投递
    string reason  = 2;    // 失败原因
}