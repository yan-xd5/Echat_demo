server:
  filter:
    - opentelemetry
    - myServerFilter
  service:
    - name: trpc.echat.controller.ControllerService
      ip: 127.0.0.1
      port: 8002
      protocol: trpc
      registry: polarismesh            # ★ 注册到北极星

# Controller 作为 client 调用 API 服务
client:
  filter:
    - opentelemetry
  service:
    - name: trpc.echat.api.UserService
      discovery: polarismesh           # ★ 通过北极星发现（不再硬编码 target）
      protocol: trpc

plugins:
  registry:
    polarismesh:
      protocol: grpc
      address_list: 127.0.0.1:8091

  selector:
    polarismesh:
      address_list: 127.0.0.1:8091

  telemetry:
    opentelemetry:
      addr: http://127.0.0.1:4318
      tenant_id: echat
      sampler:
        fraction: 1.0
