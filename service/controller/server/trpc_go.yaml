server:
  filter:
    - opentelemetry
    - myServerFilter
  service:
    - name: echat.controller.ControllerService
      ip: 127.0.0.1
      port: 8002
      protocol: trpc
      registry: polarismesh            # ★ 注册到北极星

client:
  filter:
    - opentelemetry
  service:
    - name: echat.api.UserService
      namespace: default               # ★ 缺失的 namespace
      discovery: polarismesh
      protocol: trpc

plugins:
  registry:
    polarismesh:
      register_self: true
      protocol: grpc
      address_list: 127.0.0.1:8091
      service:                         # ★ 显式列出要注册的服务
        - name: echat.controller.ControllerService
          namespace: default
          token: polaris               # 默认 token

  selector:
    polarismesh:
      address_list: 127.0.0.1:8091

  telemetry:
    opentelemetry:
      addr: http://127.0.0.1:4318
      tenant_id: echat
      sampler:
        fraction: 1.0
