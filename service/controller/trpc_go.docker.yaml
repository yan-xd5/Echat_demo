server:
  filter:
    - opentelemetry
    - metrics
    - myServerFilter
  service:
    - name: echat.controller.ControllerService
      ip: controller
      port: 8002
      protocol: trpc
      registry: polarismesh            # ★ 注册到北极星

client:
  filter:
    - opentelemetry
  service:
    - name: echat.redis.service
      target: redis://redis:6379/0
      timeout: 60000
    - name: echat.api.UserService
      namespace: default               # ★ 缺失的 namespace
      discovery: polarismesh
      protocol: trpc

plugins:
  registry:
    polarismesh:
      register_self: true
      protocol: grpc
      address_list: polaris:8091
      debug: true
      disable_health_check: true       # 绕过健康检查阻塞注册
      service:                         # ★ 显式列出要注册的服务
        - name: echat.controller.ControllerService
          namespace: default
          token: polaris               # 默认 token

  selector:
    polarismesh:
      address_list: polaris:8091
      debug: true
      service_router:
        need_return_all_nodes: true

  telemetry:
    opentelemetry:
      addr: http://127.0.0.1:4318
      tenant_id: echat-controller
      sampler:
        fraction: 1.0
