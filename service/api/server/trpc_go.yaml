server:
  filter:                           # ★ OpenTelemetry 服务端 Filter
    - opentelemetry
  service:
    # 对内：tRPC 协议（Controller、Gateway 调用）
    - name: trpc.echat.api.UserService
      ip: 127.0.0.1
      port: 8001
      protocol: trpc

    # 对外：HTTP 协议（前端 / App 调用）
    - name: trpc.echat.api.UserService.http
      ip: 0.0.0.0
      port: 9001
      protocol: http

plugins:
  telemetry:
    opentelemetry:
      addr: http://127.0.0.1:4318
      tenant_id: echat
      sampler:
        fraction: 1.0
