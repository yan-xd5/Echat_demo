syntax = "proto3";

package echat.api;

option go_package = "echat/service/api/stub";

import "trpc/api/annotations.proto";

// ============================================================
// 好友服务
// ============================================================
service FriendService {
    rpc ApplyFriend(ApplyFriendRequest) returns (ApplyFriendResponse) {
        option (trpc.api.http) = {
            post: "/api/v1/friend/apply"
            body: "*"
        };
    }
    rpc AcceptFriend(AcceptFriendRequest) returns (AcceptFriendResponse) {
        option (trpc.api.http) = {
            post: "/api/v1/friend/accept"
            body: "*"
        };
    }
    rpc RejectFriend(RejectFriendRequest) returns (RejectFriendResponse) {
        option (trpc.api.http) = {
            post: "/api/v1/friend/reject"
            body: "*"
        };
    }
    rpc DeleteFriend(DeleteFriendRequest) returns (DeleteFriendResponse) {
        option (trpc.api.http) = {
            delete: "/api/v1/friend/{fid}"
        };
    }
    rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse) {
        option (trpc.api.http) = {
            get: "/api/v1/friend/list"
        };
    }
    rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse) {
        option (trpc.api.http) = {
            get: "/api/v1/friend/requests"
        };
    }
}

message ApplyFriendRequest {
    string to_uid    = 1;
    string apply_text = 2;
}

message ApplyFriendResponse {
    string req_id = 1;
}

message AcceptFriendRequest {
    string req_id = 1;
}

message AcceptFriendResponse {
    string fid = 1;
}

message RejectFriendRequest {
    string req_id = 1;
}

message RejectFriendResponse {}

message DeleteFriendRequest {
    string fid = 1;
}

message DeleteFriendResponse {}

message ListFriendsRequest {}

message ListFriendsResponse {
    repeated FriendInfo friends = 1;
}

message ListRequestsRequest {
    string direction = 1; // "received" or "sent"
}

message ListRequestsResponse {
    repeated FriendRequestInfo requests = 1;
}

message FriendInfo {
    string fid         = 1;
    string uid         = 2;
    string username    = 3;
    string avatar      = 4;
    string remark      = 5;
    bool   is_blacklist = 6;
}

message FriendRequestInfo {
    string req_id      = 1;
    string sender_uid  = 2;
    string sender_name = 3;
    string apply_text  = 4;
    string status      = 5;
    int64  create_time = 6;
}
